<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iscrizione confermata — Altrabolletta</title>
<style>
  :root {
    --ink: #1f2b1c;
    --ink-soft: #5b6b54;
    --bg: #f7faf2;
    --line: #dde9d2;
    --accent: #7ac843;
    --accent-hover: #408f55;
    --accent-soft: #eef7e2;
    --rainbow: linear-gradient(90deg,#c9d92e,#7ac843,#2f9e8f,#3a6ea5,#a25fc9,#e0567e,#f2a900);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .rainbow-bar { height: 5px; background: var(--rainbow); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--ink);
    margin-bottom: 48px;
  }
  .logo span { color: var(--accent-hover); }

  .icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
  }
  .icon svg { width: 36px; height: 36px; }

  h1 {
    font-size: 32px;
    line-height: 1.2;
    letter-spacing: -0.4px;
    margin-bottom: 16px;
  }
  p.lead {
    font-size: 16px;
    color: var(--ink-soft);
    line-height: 1.65;
    max-width: 440px;
    margin-bottom: 36px;
  }

  .back {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
  }

  @media (max-width: 600px) {
    main { padding: 32px 16px; justify-content: flex-start; padding-top: 48px; }
    .logo { margin-bottom: 32px; }
    h1 { font-size: 24px; }
    p.lead { font-size: 15px; max-width: none; }
    .back { display: block; text-align: center; }
  }
</style>
</head>
<body>

<div class="rainbow-bar"></div>

<main>
  <a class="logo" href="coming-soon.html">altra<span>bolletta</span>.it</a>

  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#408f55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <h1>Sei nella lista!</h1>
  <p class="lead">Ti avviseremo non appena Altrabolletta sarà online. Nel frattempo, grazie per la fiducia.</p>

  <a class="back" href="coming-soon.html">Torna alla home</a>
</main>

<footer>
  &copy; 2026 Altrabolletta &nbsp;·&nbsp; <a id="ab-contact" style="color:inherit;"></a>
</footer>

<script>
(function () {
  var u = 'info', d = 'altrabolletta.it';
  var a = document.getElementById('ab-contact');
  a.href = 'mailto:' + u + '@' + d;
  a.textContent = u + '@' + d;
})();
</script>

</body>
</html>
